name: Anoria
description: >-
  Anoria is a Y Combinator (Spring 2026) human-interaction company building a
  wearable bracelet for the EQ era that measures and tracks emotional states in
  real time. The device uses the company's proprietary SOMI (state-of-mind
  inference) model to correlate roughly 150 audio and biometric signals into a
  "Flow Score" that reflects a user's energy, mood, and focus, then explains why
  the user feels that way and what they can do about it. Anoria targets founders
  and creatives who treat their mental state as a performance asset, with the
  goal of making emotional intelligence trainable. As of mid-2026 the company is
  an early-stage prototype running an early-access waitlist; it publishes no
  public developer API, SDK, or documentation yet, so this API Evangelist profile
  captures verified company identity only.
